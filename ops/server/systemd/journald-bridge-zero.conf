# /etc/systemd/journald.conf.d/bridge-zero.conf
# Bridge Zero writes about 213,000 lines (15 MB of text) a day: the release watcher about 150,000,
# the auto-mint about 55,000, the two relayers about 5,000 (laptop logs, Oct 31). With its per-line
# metadata the journal takes about 160 MB a day for them, so 2 GB keeps about 12 days.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=4G
SystemMaxFileSize=128M
MaxRetentionSec=1month
