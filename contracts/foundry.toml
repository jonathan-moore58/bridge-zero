[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Compiler. Our code is Solidity 0.8.27: blake2b-solidity declares `pragma solidity 0.8.27;`
# (exact) and every other 0.8 library accepts 0.8.27. Files under src/ are held to it by the
# restriction below; tests and scripts declare `pragma solidity 0.8.27;` as well.
compilation_restrictions = [{ paths = "src/**", version = "=0.8.27" }]
optimizer = true
optimizer_runs = 200
# Sepolia runs the Osaka rules (EIP-7883 MODEXP pricing, EIP-7825 gas cap per transaction).
# Tests execute under them; solc 0.8.27 has no osaka target, so the bytecode is compiled for
# prague. forge does not enforce the per-transaction cap here (enable_tx_gas_limit is off),
# so the import benchmark sends its call with the cap as the gas limit.
evm_version = "osaka"
# Each top-level call in a test runs as its own transaction (cold accounts and storage, and
# the gas used includes the 21,000 base and calldata). The numbers in docs/GAS.md rely on it.
isolate = true

# Remappings are listed by hand. Auto-detection would also import the libraries' own
# settings, including an `@openzeppelin/` entry pointing at a node_modules folder that
# is not vendored.
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "blake2b-solidity/=lib/blake2b-solidity/contracts/",
    "solidity-merkle-trees/=lib/solidity-merkle-trees/src/",
    "crypto-lib/=lib/crypto-lib/src/",
    # crypto-lib imports its own files as "@solidity/...". A context-scoped remapping
    # ("lib/crypto-lib/:@solidity/=...") would put this machine's absolute path into the
    # contract metadata, so the prefix is mapped globally. Nothing else uses "@solidity/".
    "@solidity/=lib/crypto-lib/src/",
]

# Tests read the captured chain data (vm.readFile). The vault tests also run against the V3 build
# (out-v3, profile v3 below) and check that it was compiled from the current source.
fs_permissions = [
    { access = "read", path = "../fixtures/mainnet" },
    { access = "read", path = "../fixtures/mainnet-pre-v3" },
    { access = "read", path = "../fixtures/v3-testnet" },
    { access = "read", path = "../fixtures/westend-asset-hub-revive" },
    { access = "read", path = "../fixtures/v3-testnet-vault" },
    { access = "read", path = "../fixtures/v3-testnet-mint" },
    { access = "read", path = "../fixtures/v3-testnet-kit" },
    { access = "read", path = "out-v3" },
    { access = "read", path = "src/bridge" },
]

# The Sepolia deployment build (script/deploy-sepolia.mjs). The libraries are linked at compile time,
# at the addresses the deployer 0xD9838A86cF83C28Ee486544060D1cA4Ca2971071 creates with its nonces 0
# to 3, so every contract carries the metadata forge verify-contract compiles for Etherscan.
# Build: FOUNDRY_PROFILE=sepolia forge build --skip test --skip script
[profile.sepolia]
out = "out-sepolia"
libraries = [
    "lib/crypto-lib/src/lib/libSCL_EIP6565.sol:SCL_EIP6565:0x51da20bE3e6E23296f2c435b16445aAe7A18b77E",
    "src/grandpa/GrandpaCodec.sol:GrandpaCodec:0x482a1c993e169E962539c38eFdB26E9e0621dFD2",
    "src/grandpa/AuthoritySets.sol:AuthoritySets:0xf2Cd69bC5fF06F98E4dd0d4DE42565d3338ce6D2",
    "src/trie/StorageProofs.sol:StorageProofs:0x5DA053Bc5659ba9f725E4b1B5083545B933EF2a3",
]

# The Portaldot V3 testnet build: pallet-revive runs EVM bytecode with REVM, and solc 0.8.27 code
# compiled for cancun (PUSH0 included) runs there unchanged. relayer/src/v3-vault.ts deploys
# out-v3/PortaldotVault.sol/PortaldotVault.json. The Sepolia side keeps osaka (above).
# Every byte of code costs a storage deposit on V3 (about 0.078 tPOT), so the bytecode carries no
# CBOR metadata (V3 has no explorer that reads it) and the vault is compiled with the IR pipeline:
# 899 bytes of runtime code, against 1,370 with the legacy pipeline. The other sources keep the
# legacy pipeline, as the ed25519 library does not compile with the IR one (stack too deep). The
# artifacts keep their AST, which names the immutables v3-vault.ts fills in to check deployed code.
# Build: FOUNDRY_PROFILE=v3 forge build --skip test --skip script
[profile.v3]
out = "out-v3"
evm_version = "cancun"
cbor_metadata = false
bytecode_hash = "none"
ast = true
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [
    { paths = "src/**", version = "=0.8.27" },
    { paths = "src/bridge/**", via_ir = true },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
# Modified third-party copies keep their upstream formatting, so the diff against the
# original stays limited to the documented changes.
ignore = ["src/**/vendor/**"]
